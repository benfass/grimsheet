<!doctype html>
<html><head>
<script>/* Grimsheet TEST build: saved data kept apart from the main extension */
window.GRIMSHEET_TEST = true;
(function () {
  var P = 'test:', S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem, k = S.key;
  S.getItem = function (x) { return g.call(this, P + x); };
  S.setItem = function (x, v) { return s.call(this, P + x, v); };
  S.removeItem = function (x) { return r.call(this, P + x); };
  var ae = window.addEventListener;
  window.addEventListener = function (t, f, o) {
    if (t === 'storage' && typeof f === 'function') return ae.call(window, t, function (e) { if (e.key && e.key.indexOf(P) === 0) f({ key: e.key.slice(P.length), newValue: e.newValue, oldValue: e.oldValue, storageArea: e.storageArea, url: e.url }); }, o);
    return ae.call(window, t, f, o);
  };
  window.__gsCopyMain = function () {
    var keys = [], i, n = 0;
    for (i = 0; i < localStorage.length; i++) { var key = k.call(localStorage, i); if (key && key.indexOf(P) !== 0 && key.indexOf('grimsheet') === 0) keys.push(key); }
    keys.forEach(function (key) { s.call(localStorage, P + key, g.call(localStorage, key)); n++; });
    return n;
  };
})();
</script>
<meta charset="utf-8"><title>Grimsheet handout</title><script src="shared.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya:ital@0;1&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Alegreya,Georgia,serif}
.card{position:absolute;inset:10px;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;color:#2b2015;
  background:radial-gradient(ellipse at 30% 20%,#f8efd9,#ecdcb6 60%,#dfc999);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(90,60,25,.35),inset 0 0 40px rgba(120,80,30,.25)}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-bottom:1px solid rgba(90,60,25,.25)}
.ico{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:rgba(90,60,25,.12);overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.tt{flex:1;min-width:0}
.kind{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#7a5a32;font-weight:700}
h1{margin:0;font-family:"Alegreya SC",Georgia,serif;font-size:1.35rem;line-height:1.15;overflow-wrap:anywhere}
.x{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(90,60,25,.4);background:rgba(255,255,255,.35);color:#4a3520;font-size:1rem;cursor:pointer}
.x:hover{background:rgba(255,255,255,.7)}
.body{flex:1;overflow:auto;padding:12px 16px 14px;font-size:1.02rem;line-height:1.45}
.body img.pic{display:block;max-width:100%;max-height:60vh;margin:0 auto 12px;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.3);cursor:zoom-in}
.body img.pic.big{max-height:none;cursor:zoom-out}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.from{padding:6px 16px 10px;font-size:.8rem;color:#7a5a32;font-style:italic;text-align:right}
.more{display:flex;gap:6px;justify-content:center;padding:0 0 10px}
.more[hidden],.card[hidden]{display:none}
.more button{border:1px solid rgba(90,60,25,.4);background:rgba(255,255,255,.35);border-radius:999px;padding:3px 12px;font-family:inherit;cursor:pointer;color:#4a3520}
</style></head>
<body><div class="card" id="card" hidden>
  <div class="top"><div class="ico" id="ico"></div><div class="tt"><div class="kind" id="kind"></div><h1 id="title"></h1></div><button class="x" id="x" title="Close" aria-label="Close">✕</button></div>
  <div class="body" id="body"></div><div class="more" id="more" hidden><button id="prev">‹ Earlier</button><button id="next">Later ›</button></div><div class="from" id="from"></div>
</div>
<script>
/* A handout window: the background page opens this popover in the middle of the map when the DM shows a note to
   the players, and keeps the handouts in browser storage (grimsheet.handout.q). It stays open until closed. */
(function () {
  const POP = 'com.grimsheet-test/handout', QKEY = 'grimsheet.handout.q', ALIVE = 'grimsheet.handout.alive';
  const KIND = { session: 'Session', npc: 'NPC', place: 'Place', quest: 'Quest', item: 'Item', note: 'Handout' };
  const $ = s => document.getElementById(s), esc = GS.esc;
  let list = [], at = 0;
  function show() {
    const h = list[at]; if (!h) return; const n = h.note || {};
    $('card').hidden = false;
    $('kind').textContent = KIND[n.type] || 'Handout'; $('title').textContent = n.title || '';
    const ic = $('ico'); ic.innerHTML = n.icon ? esc(n.icon) : n.img && n.img.url ? `<img src="${esc(n.img.url)}" alt="">` : '📜';
    $('body').innerHTML = (n.img && n.img.url ? `<img class="pic" src="${esc(n.img.url)}" alt="" onerror="this.remove()">` : '') + `<div class="txt">${esc(String(n.body || '').replace(/\[\[([^\]]{1,80})\]\]/g, '$1'))}</div>`;
    const p = $('body').querySelector('.pic'); if (p) p.onclick = () => p.classList.toggle('big');
    $('from').textContent = h.by ? 'Shown by ' + h.by : '';
    $('more').hidden = list.length < 2; $('prev').disabled = at === 0; $('next').disabled = at >= list.length - 1;
    $('body').scrollTop = 0;
  }
  function drain() {
    const q = GS.read(QKEY) || []; if (!q.length) return;
    GS.write(QKEY, []);
    q.forEach(x => { if (!x || !x.note) return; list = list.filter(y => y.note.id !== x.note.id); list.push(x); });
    list = list.slice(-10); at = list.length - 1; show();
  }
  $('prev').onclick = () => { if (at > 0) { at--; show(); } };
  $('next').onclick = () => { if (at < list.length - 1) { at++; show(); } };
  GS.sdk().then(OBR => OBR.onReady(() => {
    const alive = () => GS.write(ALIVE, { at: Date.now() });
    $('x').onclick = () => { GS.write(ALIVE, { at: 0 }); OBR.popover.close(POP).catch(() => { }); };
    alive(); setInterval(() => { alive(); drain(); }, 400);
    window.addEventListener('storage', ev => { if (ev.key === QKEY) drain(); });
    drain();
  }));
})();
</script></body></html>
