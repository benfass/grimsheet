window.GRIMSHEET_TEST = true;
(function () {
  var P = 'test:', S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem, k = S.key;
  S.getItem = function (x) { return g.call(this, P + x); };
  S.setItem = function (x, v) { return s.call(this, P + x, v); };
  S.removeItem = function (x) { return r.call(this, P + x); };
  var ae = window.addEventListener;
  window.addEventListener = function (t, f, o) {
    if (t === 'storage' && typeof f === 'function') return ae.call(window, t, function (e) { if (e.key && e.key.indexOf(P) === 0) f({ key: e.key.slice(P.length), newValue: e.newValue, oldValue: e.oldValue, storageArea: e.storageArea, url: e.url }); }, o);
    return ae.call(window, t, f, o);
  };
  window.__gsCopyMain = function () {
    var keys = [], i, n = 0;

  };
})();
</script>

<body>
<script>
/* Grimsheet background page for Owlbear Rodeo. Runs for each player while they are in the room,
   even when the Grimsheet panel is closed:
   - notifications and the table feed for rolls shared by other players;
   - token right-click menus: players link their own token; the GM gets a menu to link any player,
     apply damage or healing, open the sheet or unlink;
   - applies the GM's damage and healing to this player's saved character and answers the GM's
     requests to view the sheet;
   - for the GM: keeps players' attacks against tokens until the GM confirms them in Grimsheet. */
(function () {
  const S = GS;
  const ICON = new URL('icon.svg', location.href).href;
  const GM_URL = new URL('gm.html', location.href).href;

  S.sdk().then(OBR => OBR.onReady(async () => {
    const room = OBR.room && OBR.room.id ? OBR.room.id : 'room';
    const FEED = 'grimsheet.feed.' + room;
    // a co-DM (a player the main DM made co-DM) gets the GM side here too; a change of DMs restarts this page
    const DMKEY = 'com.grimsheet-test/dms';
    let dms = {}; try { dms = ((await OBR.room.getMetadata()) || {})[DMKEY] || {}; } catch (e) { }
    const realRole = { v: await OBR.player.getRole() };
    const eff = () => (realRole.v === 'GM' || (dms.co || {})[OBR.player.id] ? 'GM' : realRole.v);
    const me = { id: OBR.player.id, name: await OBR.player.getName(), role: eff() };
    OBR.player.onChange(p => { me.name = p.name; if (p.role !== realRole.v) { realRole.v = p.role; if (eff() !== me.role) location.reload(); } });
    OBR.room.onMetadataChange(md => { dms = (md || {})[DMKEY] || {}; if (eff() !== me.role) location.reload(); });
    // the DM device that keeps the tokens up to date (the panels hold this lease); with none, the main DM's
    const DEV = (() => { try { return localStorage.getItem('grimsheet.device.v1') || ''; } catch (e) { return ''; } })();
    const iHandle = md => { const l = (md || {})['com.grimsheet-test/drive.gm']; if (l && Date.now() - (l.at || 0) < 30000) return l.dev === DEV; return !dms.main || dms.main === me.id; };

    // heartbeat: while fresh, the panel leaves notifications and GM requests to this page
    const beat = () => S.write(S.BG, { at: Date.now(), room, v: S.VERSION });
    beat(); setInterval(beat, 15000);

    // new version on the site: the background page reloads itself (it otherwise runs until the room is reloaded)
    const vNum = v => String(v || '').split('.').map(n => parseInt(n, 10) || 0).reduce((a, n) => a * 1000 + n, 0);
    setInterval(async () => {
      try { const r = await fetch(new URL('manifest.json', location.href).href + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok && vNum((await r.json()).version) > vNum(S.VERSION)) location.reload(); } catch (e) { }
    }, 5 * 60 * 1000);

    // main extension: pause while Grimsheet TEST runs in this room (no drawings, menus or messages)
    let paused = S.testRunning(room);
    const listen = (ch, fn) => OBR.broadcast.onMessage(ch, ev => { if (!paused) return fn(ev); });
    const onPause = [];
    setInterval(() => {
      const now = S.testRunning(room); if (now === paused) return;
      paused = now; onPause.forEach(f => { try { f(paused); } catch (e) { } });
      if (paused) OBR.notification.show('Grimsheet TEST is running in this room, so Grimsheet is paused here until it\'s turned off.', 'INFO').catch(() => { });
    }, 5000);

    // test extension, GM: take over the tokens the main Grimsheet linked (copies its data onto the test names)
    if (window.GRIMSHEET_TEST) {
      const MAIN = 'com.grimsheet' + '/', TEST = 'com.grimsheet-test/';
      const takeOver = async () => {
        if (me.role !== 'GM') return;
        try {
          if (!(await OBR.scene.isReady())) return;
          const its = await OBR.scene.items.getItems(it => Object.keys(it.metadata || {}).some(k => k.startsWith(MAIN) && !((TEST + k.slice(MAIN.length)) in it.metadata)));
          if (its.length) {
            await OBR.scene.items.updateItems(its.map(i => i.id), ds => { for (const d of ds) for (const k of Object.keys(d.metadata)) if (k.startsWith(MAIN) && !((TEST + k.slice(MAIN.length)) in d.metadata)) d.metadata[TEST + k.slice(MAIN.length)] = JSON.parse(JSON.stringify(d.metadata[k])); });
            OBR.notification.show(`Grimsheet TEST took over ${its.length} token${its.length === 1 ? '' : 's'} from Grimsheet.`, 'INFO').catch(() => { });
          }
          const md = await OBR.room.getMetadata();
          if (md[MAIN + 'initiative'] && !md[TEST + 'initiative']) await OBR.room.setMetadata({ [TEST + 'initiative']: md[MAIN + 'initiative'] });
        } catch (e) { }
      };
      takeOver(); OBR.scene.onReadyChange(ready => { if (ready) takeOver(); });
    }

    /* ---- HP bars and AC on tokens, drawn by Grimsheet itself (no other extension needed) ----
       Reads the HP and AC that Grimsheet writes on tokens (the same data Stat Bubbles reads) and draws
       them as local drawings on this player's screen only, so each person sees what their role allows.
       If Stat Bubbles is already drawing in this room, Grimsheet steps aside and draws nothing. */
    (function tokenBars() {
      const B = window.OwlbearBuild; if (!B || !OBR.scene || !OBR.scene.local) return;
      const MINE = 'com.grimsheet-test/bar', MONLINK = 'com.grimsheet-test/monster';
      const drawn = {};            // token id -> signature of what we drew
      let busy = false, again = false, timer = null, dpi = 150;
      const enabled = () => { const st = S.read('grimsheet.settings.v1') || {}; return st.tokenBars !== false; };
      const num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
      const colour = f => f <= 0 ? '#6b6b6b' : f <= 0.25 ? '#c0392b' : f <= 0.5 ? '#d68910' : '#2e9e5b';
      function wanted(it) {
        const b = it.metadata && it.metadata[S.BUBBLES]; if (!b) return null;
        const hp = num(b.health), max = num(b['max health']), temp = num(b['temporary health']), ac = num(b['armor class']);
        if (me.role === 'GM' || !b.hide) return max > 0 || ac > 0 ? { hp, max, temp, ac, text: max > 0 ? hp + '/' + max + (temp > 0 ? ' +' + temp : '') : '' } : null;
        // hidden from players: only what the GM's "Monster HP for players" setting allows
        if (!it.visible) return null;
        const ml = it.metadata[MONLINK] || {};
        if (ml.hpShow === 'status' && max > 0) { const t = hp <= 0 ? 'Down' : hp <= max / 2 ? 'Bloodied' : 'Healthy'; return { hp: hp <= 0 ? 0 : hp <= max / 2 ? 1 : 3, max: hp <= 0 ? 1 : hp <= max / 2 ? 4 : 3, temp: 0, ac: 0, text: t }; }
        return null;
      }
      function build(it, w, bd) {
        const out = [], width = Math.max(bd.width * 0.9, dpi * 0.7), h = Math.round(dpi * 0.17), left = bd.center.x - width / 2, top = bd.max.y - h - dpi * 0.04;
        const common = x => x.attachedTo(it.id).locked(true).disableHit(true).visible(it.visible).disableAttachmentBehavior(['ROTATION', 'SCALE', 'LOCKED', 'COPY']).metadata({ [MINE]: { for: it.id } });
        let z = Date.now();
        if (w.text) {
          const f = w.max > 0 ? Math.max(0, Math.min(1, w.hp / w.max)) : 0;
          out.push(common(B.buildShape().shapeType('RECTANGLE').width(width).height(h).position({ x: left, y: top }).fillColor('#111111').fillOpacity(0.8).strokeColor('#000000').strokeWidth(1).strokeOpacity(0.6)).layer('ATTACHMENT').zIndex(z++).name('HP bar').build());
          if (f > 0) out.push(common(B.buildShape().shapeType('RECTANGLE').width(Math.max(2, width * f)).height(h).position({ x: left, y: top }).fillColor(colour(f)).fillOpacity(0.95).strokeWidth(0).strokeOpacity(0)).layer('ATTACHMENT').zIndex(z++).name('HP bar').build());
          if (w.temp > 0) out.push(common(B.buildShape().shapeType('RECTANGLE').width(width).height(Math.max(2, h * 0.22)).position({ x: left, y: top - Math.max(2, h * 0.22) }).fillColor('#4aa3df').fillOpacity(0.95).strokeWidth(0).strokeOpacity(0)).layer('ATTACHMENT').zIndex(z++).name('Temp HP').build());
          out.push(common(B.buildText().textType('PLAIN').plainText(w.text).width(width).height(h).position({ x: left, y: top }).textAlign('CENTER').textAlignVertical('MIDDLE').fontSize(Math.round(h * 0.8)).fontWeight(700).fontFamily('sans-serif').fillColor('#ffffff').strokeColor('#000000').strokeWidth(Math.max(1, h * 0.12)).padding(0).lineHeight(1)).layer('TEXT').zIndex(z++).name('HP').build());
        }
        if (w.ac > 0) {
          const d = Math.round(dpi * 0.3), cx = w.text ? left - d * 0.25 : bd.center.x, cy = w.text ? top + h / 2 : bd.max.y - d / 2;
          out.push(common(B.buildShape().shapeType('CIRCLE').width(d).height(d).position({ x: cx, y: cy }).fillColor('#3b4a54').fillOpacity(0.95).strokeColor('#d9d9d9').strokeWidth(2).strokeOpacity(0.9)).layer('ATTACHMENT').zIndex(z++).name('AC').build());
          out.push(common(B.buildText().textType('PLAIN').plainText(String(w.ac)).width(d).height(d).position({ x: cx - d / 2, y: cy - d / 2 }).textAlign('CENTER').textAlignVertical('MIDDLE').fontSize(Math.round(d * 0.5)).fontWeight(700).fontFamily('sans-serif').fillColor('#ffffff').strokeWidth(0).padding(0).lineHeight(1)).layer('TEXT').zIndex(z++).name('AC').build());
        }
        return out;
      }
      const NAME = 'com.grimsheet-test/nametext', COND = 'com.grimsheet-test/cond';
      function nameOf(it) { const n = it.metadata && it.metadata[NAME]; return n && n.text ? { text: String(n.text), color: n.color || '#ffffff', pos: n.pos === 'TOP' ? 'TOP' : 'BOTTOM', size: Math.max(0.5, Math.min(2, +n.size || 1)) } : null; }
      // the name tag lives in map units, so it zooms with the map like the token does, and it's sized to fit
      // within 90% of the token's width (long names get smaller text, never wider than the token)
      const measure = (() => { const c = document.createElement('canvas').getContext('2d'); return (t, f) => { c.font = '700 ' + f + 'px sans-serif'; return c.measureText(t).width; }; })();
      // a tag (dark box + text) in map units, never wider than 90% of the token; long text shrinks or goes onto
      // two lines, split at the separator nearest the middle. `at(h)` gives the tag's top from its height.
      function tag(it, text, o, bd, at) {
        const maxW = bd.width * 0.9, padX = Math.max(2, bd.width * 0.03);
        const base = Math.max(5, Math.min(dpi * 0.14, bd.width * 0.15) * (o.scale || 1)), fit = lines => Math.min(base, ...lines.map(l => base * (maxW - 2 * padX) / Math.max(1, measure(l, base))));
        let lines = [text], f = fit(lines);
        const sep = o.sep || ' ', sp = []; for (let i = text.indexOf(sep); i >= 0; i = text.indexOf(sep, i + 1)) sp.push(i);
        if (f < base * 0.75 && sp.length) { const mid = text.length / 2, cut = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a), two = [text.slice(0, cut).trim(), text.slice(cut + sep.length).trim()], f2 = Math.min(fit(two), base * 0.85); if (f2 > f * 1.15) { lines = two; f = f2; } }
        f = Math.max(4, f);
        const w = Math.min(maxW, Math.max(...lines.map(l => measure(l, f))) + 2 * padX), h = Math.round(f * (lines.length * 1.15 + 0.25)), left = bd.center.x - w / 2, top = at(h);
        const common = x => x.attachedTo(it.id).locked(true).disableHit(true).visible(it.visible).disableAttachmentBehavior(['ROTATION', 'SCALE', 'LOCKED', 'COPY']).metadata({ [MINE]: { for: it.id, name: true, kind: o.kind } });
        let z = Date.now();
        return { bottom: top + h, items: [
          common(B.buildShape().shapeType('RECTANGLE').width(w).height(h).position({ x: left, y: top }).fillColor(o.bg).fillOpacity(o.bgOpacity).strokeWidth(0).strokeOpacity(0)).layer('ATTACHMENT').zIndex(z++).name(o.label).build(),
          common(B.buildText().textType('PLAIN').plainText(lines.join('\n')).width(w).height(h).position({ x: left, y: top }).textAlign('CENTER').textAlignVertical('MIDDLE').fontSize(f).fontWeight(700).fontFamily('sans-serif').fillColor(o.color).strokeColor('#000000').strokeWidth(o.stroke ? Math.max(0.5, f * 0.08) : 0).padding(0).lineHeight(1.15)).layer('TEXT').zIndex(z++).name(o.label).build(),
        ] };
      }
      function buildName(it, n, bd) {
        const gap = Math.max(2, bd.height * 0.02);
        return tag(it, n.text, { kind: 'name', label: 'Name', color: n.color, bg: '#000000', bgOpacity: 0.55, stroke: true, scale: n.size }, bd, h => n.pos === 'TOP' ? bd.min.y - gap - h : bd.max.y + gap);
      }
      // conditions sit under the token, or under the name when the name is under the token
      function buildCond(it, text, bd, below) {
        const gap = Math.max(2, bd.height * 0.02);
        return tag(it, text, { kind: 'cond', label: 'Conditions', color: '#ffffff', bg: '#7a1f1f', bgOpacity: 0.85, scale: 0.85, sep: ' · ' }, bd, () => (below != null ? below : bd.max.y) + gap);
      }
      async function clearAll() {
        try { const ours = await OBR.scene.local.getItems(i => !!(i.metadata && i.metadata[MINE])); if (ours.length) await OBR.scene.local.deleteItems(ours.map(i => i.id)); } catch (e) { }
        for (const k in drawn) delete drawn[k];
      }
      async function sync() {
        if (busy) { again = true; return; }
        busy = true;
        try {
          if (paused) { await clearAll(); return; }
          if (!(await OBR.scene.isReady())) { for (const k in drawn) delete drawn[k]; return; }
          const local = await OBR.scene.local.getItems();
          const bubbles = local.some(i => /-(health-background|ac-background)$/.test(i.id || '') && !(i.metadata && i.metadata[MINE]));
          const bars = enabled() && !bubbles;
          try { dpi = await OBR.scene.grid.getDpi(); } catch (e) { }
          const toks = await OBR.scene.items.getItems(it => (it.layer === 'CHARACTER' || it.layer === 'MOUNT') && !!(it.metadata && (it.metadata[S.BUBBLES] || it.metadata[NAME] || it.metadata[COND])));
          const want = {};
          for (const it of toks) {
            const seen = me.role === 'GM' || it.visible, w = bars ? wanted(it) : null, n = seen ? nameOf(it) : null, c = seen && it.metadata[COND] && it.metadata[COND].text ? String(it.metadata[COND].text) : null;
            if (w || n || c) want[it.id] = { it, w, n, c, sig: JSON.stringify([w, n, c, it.visible, it.scale, it.image && it.image.width, it.grid && it.grid.dpi, dpi, me.role]) };
          }
          const mine = local.filter(i => i.metadata && i.metadata[MINE]), byTok = {};
          for (const i of mine) (byTok[i.metadata[MINE].for] = byTok[i.metadata[MINE].for] || []).push(i.id);
          const del = [], redo = [];
          for (const tok of Object.keys(byTok)) if (!want[tok] || drawn[tok] !== want[tok].sig) { del.push(...byTok[tok]); delete drawn[tok]; }
          for (const tok of Object.keys(want)) if (!byTok[tok] || drawn[tok] !== want[tok].sig) redo.push(tok);
          for (const tok of Object.keys(drawn)) if (!want[tok]) delete drawn[tok];
          if (del.length) await OBR.scene.local.deleteItems(del);
          if (!redo.length) return;
          const bounds = {};
          for (const tok of redo) { try { bounds[tok] = await OBR.scene.items.getItemBounds([tok]); } catch (e) { } }
          const add = [];
          for (const tok of redo) { if (!bounds[tok]) continue; const x = want[tok]; if (x.w) add.push(...build(x.it, x.w, bounds[tok])); let below = null; if (x.n) { const t = buildName(x.it, x.n, bounds[tok]); add.push(...t.items); if (x.n.pos !== 'TOP') below = t.bottom; } if (x.c) add.push(...buildCond(x.it, x.c, bounds[tok], below).items); drawn[tok] = x.sig; }
          if (add.length) await OBR.scene.local.addItems(add);
        } catch (e) { }
        finally { busy = false; if (again) { again = false; schedule(); } }
      }
      const schedule = () => { clearTimeout(timer); timer = setTimeout(sync, 150); };
      OBR.scene.onReadyChange(ready => { for (const k in drawn) delete drawn[k]; if (ready) schedule(); });
      OBR.scene.items.onChange(schedule);
      OBR.scene.local.onChange(items => { if (items.some(i => /-(health-background|ac-background)$/.test(i.id || '') && !(i.metadata && i.metadata[MINE]))) schedule(); });
      OBR.player.onChange(() => schedule());
      window.addEventListener('storage', ev => { if (ev.key === 'grimsheet.settings.v1') schedule(); });
      onPause.push(() => schedule());
      schedule();
    })();

    /* ---- rolls from other players ---- */
    listen(S.CH_ROLL, ev => {
      const d = ev.data;
      if (!d || d.v !== 1) return;
      if (d.gmOnly && me.role !== 'GM') return;
      const feed = S.read(FEED) || [];
      feed.unshift(d); S.write(FEED, feed.slice(0, 100));
      const extra = d.crit ? ' · critical!' : d.fumble ? ' · natural 1' : '';
      OBR.notification.show(`${d.who} (${d.char}): ${d.title} = ${d.total}${extra}${d.gmOnly ? ' [GM only]' : ''}`, d.crit ? 'SUCCESS' : d.fumble ? 'WARNING' : 'DEFAULT').catch(() => { });
    });

    /* ---- GM requests aimed at this player ---- */
    const done = new Set();
    listen(S.CH_GM, async ev => {
      const d = ev.data;
      if (!d || d.to !== me.id || done.has(d.id)) return;
      done.add(d.id);
      const store = S.read(S.STORE);
      const ch = store && store.chars && (store.chars[d.char] || store.chars[store.active]);
      if (d.type === 'hp') {
        if (!ch) return;
        const r = S.applyHp(ch, +d.amount || 0);
        S.write(S.STORE, store);
        // keep the party panel and the token in step with the new HP
        const all = S.read(S.STATUS) || {}; const st = Object.assign({}, all[ch.id] || {}, { charId: ch.id, char: ch.name, hp: r.hp, max: r.max, temp: r.temp, down: r.hp <= 0 });
        all[ch.id] = st; S.write(S.STATUS, all);
        if (store.active === ch.id) OBR.player.setMetadata({ [S.META]: st }).catch(() => { });
        try {
          const items = await OBR.scene.items.getItems(it => !!(it.metadata && it.metadata[S.LINK] && it.metadata[S.LINK].player === me.id && it.metadata[S.LINK].char === ch.id));
          if (items.length) await OBR.scene.items.updateItems(items.map(i => i.id), drafts => { for (const it of drafts) it.metadata[S.BUBBLES] = Object.assign({}, it.metadata[S.BUBBLES] || {}, { health: r.hp, 'max health': r.max, 'temporary health': r.temp }); });
        } catch (e) { }
        // concentrating: a CON save to keep the spell (DC 10 or half the damage); at 0 HP it ends (the panel tidies up)
        let conc = '';
        if (ch.conc && ch.conc.name && d.amount < 0) {
          if (r.hp <= 0) {
            conc = ` ${ch.conc.name} ends.`; const name = ch.conc.name, id = ch.conc.id; ch.conc = null;
            (ch.modules || []).forEach(m => (m.entries || []).forEach(e => { if (e.id === id && e.effect && !e.item) e.effect.active = false; }));
            S.write(S.STORE, store);
            OBR.scene.items.getItems(it => !!(it.metadata && it.metadata['com.grimsheet-test/area'] && it.metadata['com.grimsheet-test/area'].owner === me.id && it.metadata['com.grimsheet-test/area'].name === name))
              .then(its => its.length && OBR.scene.items.deleteItems(its.map(i => i.id))).catch(() => { });
          }
          else {
            const dc = Math.min(30, Math.max(10, Math.floor(-d.amount / 2))), key = 'grimsheet.saves.' + room, q = S.read(key) || [];
            q.unshift({ id: S.uid(), kind: 'conc', ability: 'CON', dc, what: ch.conc.name, dmg: -d.amount, char: ch.id }); S.write(key, q.slice(0, 10));
            conc = ` Concentration check: CON save DC ${dc} to keep ${ch.conc.name}.`;
          }
        }
        OBR.notification.show(`${d.from}: ${r.text} to ${ch.name}. HP ${r.hp}/${r.max}${r.temp ? ' (+' + r.temp + ' temp)' : ''}.${conc}`, d.amount < 0 ? 'WARNING' : 'SUCCESS').catch(() => { });
      }
      if (d.type === 'inspire') {
        if (!ch) return;
        ch.inspiration = true; S.write(S.STORE, store);
        const all = S.read(S.STATUS) || {}; const st = Object.assign({}, all[ch.id] || {}, { insp: true }); all[ch.id] = st; S.write(S.STATUS, all);
        if (store.active === ch.id) OBR.player.setMetadata({ [S.META]: st }).catch(() => { });
        OBR.notification.show(`${d.from} gives ${ch.name} Heroic Inspiration ★`, 'SUCCESS').catch(() => { });
        return;
      }
      if (d.type === 'hbGive') {
        if (!ch || !d.entry) return;
        const m = S.hbPlace(ch, d.entry); S.write(S.STORE, store);
        OBR.notification.show(`${d.from} gives ${ch.name} ${d.entry.name} (added to ${m.title}).`, 'SUCCESS').catch(() => { });
        return;
      }
      if (d.type === 'sheetReq') {
        if (!ch) { OBR.broadcast.sendMessage(S.CH_GM, { type: 'sheet', id: d.id, to: d.from, error: 'no character' }, { destination: 'REMOTE' }).catch(() => { }); return; }
        const parts = S.chunks(await S.pack(ch));
        for (let i = 0; i < parts.length; i++) await OBR.broadcast.sendMessage(S.CH_GM, { type: 'sheet', id: d.id, to: d.from, part: i, parts: parts.length, data: parts[i], owner: me.name }, { destination: 'REMOTE' }).catch(() => { });
      }
    });

    /* ---- room homebrew: the GM answers who asks; players keep a copy of what the GM shows ---- */
    const hbAll = () => S.read(S.HB) || {};
    const hbSend = x => OBR.broadcast.sendMessage(S.CH_HB, x, { destination: 'REMOTE' }).catch(() => { });
    let hbAt = 0;
    const hbHello = () => { hbAt = Date.now(); hbSend({ type: 'hello', from: me.id, have: S.hbRoom(hbAll(), room).items.map(x => [x.id, x.updated]) }); };
    let hbAsk = null;
    const hbParts = {};
    listen(S.CH_HB, async ev => {
      const d = ev.data; if (!d) return;
      if (me.role === 'GM') {
        if (d.type !== 'hello') return;
        const vis = S.hbRoom(hbAll(), room).items.filter(x => !x.hidden), have = new Map(d.have || []);
        hbSend({ type: 'list', items: vis.map(x => [x.id, x.updated]) });
        vis.filter(x => !have.has(x.id) || have.get(x.id) < x.updated).forEach(x => S.hbSendItem(hbSend, x));
        return;
      }
      if (d.type === 'upz') {
        const b = hbParts[d.id] = hbParts[d.id] || { p: [], n: d.parts, t: Date.now() }; b.p[d.part] = d.data;
        if (b.p.filter(x => x != null).length < b.n) return;
        delete hbParts[d.id];
        try { const item = await S.unpack(b.p.join('')); const all = hbAll(), h = S.hbRoom(all, room), fresh = !h.items.some(x => x.id === item.id); if (S.hbMerge(h, item)) S.write(S.HB, all); if (fresh && Date.now() - hbAt > 5000) OBR.notification.show(`The GM shared ${item.e.name}. Add it from Grimsheet: Browse → Room homebrew.`, 'INFO').catch(() => { }); } catch (e) { }
        return;
      }
      const all = hbAll(), h = S.hbRoom(all, room);
      if (d.type === 'up') {
        const fresh = d.item && !h.items.some(x => x.id === d.item.id);
        if (S.hbMerge(h, d.item)) S.write(S.HB, all);
        // something newly shown (not the catch-up after joining): tell the player where to find it
        if (fresh && Date.now() - hbAt > 5000) OBR.notification.show(`The GM shared ${d.item.e.name}. Add it from Grimsheet: Browse → Room homebrew.`, 'INFO').catch(() => { });
      }
      if (d.type === 'list') {
        const miss = S.hbList(h, d.items); S.write(S.HB, all);
        if (miss) { clearTimeout(hbAsk); hbAsk = setTimeout(() => { if (S.hbList(JSON.parse(JSON.stringify(S.hbRoom(hbAll(), room))), d.items)) hbHello(); }, 1500); }
      }
    });
    if (me.role !== 'GM') setTimeout(hbHello, 2000);

    /* ---- backups: the GM keeps players' characters and hands them back on request ---- */
    const bkSend = x => OBR.broadcast.sendMessage(S.CH_BK, x, { destination: 'REMOTE' }).catch(() => { });
    const bkParts = {};
    listen(S.CH_BK, async ev => {
      const d = ev.data; if (!d || me.role !== 'GM') return;
      if (d.type === 'pcb') {
        const b = bkParts[d.id] = bkParts[d.id] || { parts: [], n: d.parts, t: Date.now() }; b.parts[d.part] = d.data;
        for (const [k, v] of Object.entries(bkParts)) if (Date.now() - v.t > 120e3) delete bkParts[k];
        if (b.parts.filter(x => x != null).length < b.n) return;
        delete bkParts[d.id];
        const all = S.read(S.PCB) || {}; if (S.mergePcb(all, room, Object.assign({}, d, { data: b.parts.join('') }))) S.write(S.PCB, all);
        bkSend({ type: 'pcbAck', to: d.from, charId: d.charId, changedAt: d.changedAt });
        return;
      }
      const mine = ((S.read(S.PCB) || {})[room] || {})[d.from] || { chars: {} };
      if (d.type === 'pcbList') { bkSend({ type: 'pcbIndex', to: d.from, re: d.id, list: Object.entries(mine.chars).map(([charId, x]) => ({ charId, name: x.name, cls: x.cls, level: x.level, changedAt: x.changedAt })) }); return; }
      if (d.type === 'pcbGet') {
        const x = mine.chars[d.charId]; if (!x) return;
        const parts = S.chunks(x.data);
        for (let i = 0; i < parts.length; i++) await bkSend({ type: 'pcbData', id: d.id, to: d.from, charId: d.charId, part: i, parts: parts.length, data: parts[i] });
      }
    });

    /* ---- campaign notes: keep the party journal up to date and answer newcomers ---- */
    const campGet = () => { const a = S.read(S.CAMP) || {}, c = a[room] || { name: '', notes: [], gone: {} }; c.notes = c.notes || []; c.gone = c.gone || {}; return c; };
    const campPut = c => { const a = S.read(S.CAMP) || {}; a[room] = c; S.write(S.CAMP, a); };
    const replies = {};
    listen(S.CH_NOTES, ev => {
      const d = ev.data; if (!d) return;
      if (d.type === 'up' || d.type === 'del') {
        Object.values(replies).forEach(r => r.skip.add(d.type === 'up' ? d.note.id : d.id));
        const c = campGet();
        if (d.type === 'up' ? S.mergeNote(c, d.note) : (S.dropNote(c, d.id, d.at), true)) campPut(c);
        return;
      }
      if (d.type === 'name') { const c = campGet(); if ((c.nameAt || 0) < d.at) { c.name = d.name; c.nameAt = d.at; campPut(c); } return; }
      if (d.type === 'hello' && d.from !== me.id) {
        const c = campGet(), have = new Map(d.have || []);
        for (const [id, at] of d.gone || []) if (!c.gone[id] || c.gone[id] < at) S.dropNote(c, id, at);
        campPut(c);
        const mine = c.notes.filter(n => n.vis === 'party' && (!have.has(n.id) || have.get(n.id) < n.updated));
        const gone = Object.entries(c.gone).filter(([id]) => have.has(id));
        if (!mine.length && !gone.length) return;
        const key = d.from + Math.random(), r = replies[key] = { skip: new Set() };
        setTimeout(() => {
          delete replies[key];
          const send = x => OBR.broadcast.sendMessage(S.CH_NOTES, x, { destination: 'REMOTE' }).catch(() => { });
          mine.filter(n => !r.skip.has(n.id)).forEach(n => send({ type: 'up', note: n }));
          gone.filter(([id]) => !r.skip.has(id)).forEach(([id, at]) => send({ type: 'del', id, at }));
          if (c.name) send({ type: 'name', name: c.name, at: c.nameAt || 0 });
        }, 150 + Math.random() * 900);
      }
    });

    const endSeen = new Set();
    /* ---- initiative: the GM asks for rolls; tell this player when it's their turn ---- */
    listen(S.CH_GM, ev => {
      const d = ev.data;
      if (d && d.type === 'atk' && d.v === 1 && me.role === 'GM') {
        const key = 'grimsheet.attacks.' + room;
        S.write(key, S.mergeAttack(S.read(key) || [], d));
        if (d.part === 'area') { OBR.notification.show(`${d.attacker}: ${d.name} (${d.areaLabel}), ${(d.targets || []).length} inside. Resolve it in Grimsheet.`, 'DEFAULT').catch(() => { }); return; }
        const what = d.part === 'atk' ? d.total + ' to hit' + (d.crit ? ' (natural 20!)' : d.fumble ? ' (natural 1)' : '') : d.part === 'heal' ? d.total + ' healing' : d.total + ' ' + (d.types || '') + ' damage';
        OBR.notification.show(`${d.attacker} → ${d.target.name}: ${what}. Confirm it in Grimsheet.`, d.crit ? 'SUCCESS' : 'DEFAULT').catch(() => { });
        return;
      }
      // a player ended their turn and the GM's panel is closed: move the turn on here (the panel catches up on monster turn starts when opened)
      if (d && d.type === 'endTurn' && me.role === 'GM') {
        const beat = S.read('grimsheet.gmpanel.v1');
        if (beat && beat.room === room && Date.now() - beat.at < 25000) return;
        if (endSeen.has(d.id)) return; endSeen.add(d.id);
        OBR.room.getMetadata().then(md => {
          if (!iHandle(md)) return;   // another DM's Grimsheet moves the turn on
          const I = md && md['com.grimsheet-test/initiative'];
          if (!I || !I.active || !I.rows || !I.rows.length || I.turn !== d.key || I.round !== d.round) return;
          const i = I.rows.findIndex(r => r.k === I.turn); let j = i + 1, round = I.round;
          if (j >= I.rows.length) { j = 0; round++; }
          const next = I.rows[j];
          const all = S.read(S.ENCKEY) || {}, r = S.encRoom(all, room), e = r.list[r.active];
          if (!e || !e.combat || !e.combat.active || e.combat.turn !== d.key) return;
          e.combat.turn = next.k; e.combat.round = round; e.combat.pendingStart = next.k; S.write(S.ENCKEY, all);
          OBR.room.setMetadata({ 'com.grimsheet-test/initiative': Object.assign({}, I, { turn: next.k, round }) }).catch(() => { });
          OBR.notification.show(`${d.who} ended their turn. Now: ${next.name}${round !== I.round ? ' (round ' + round + ')' : ''}.`, 'INFO').catch(() => { });
        }).catch(() => { });
        return;
      }
      if (d && d.type === 'restCall' && me.role !== 'GM') {
        const key = 'grimsheet.saves.' + room, q = S.read(key) || [];
        if (!q.some(x => x.id === d.id)) { q.unshift({ id: d.id, kind: 'rest', rest: d.kind, from: d.from }); S.write(key, q.slice(0, 10)); }
        OBR.notification.show(`${d.from} calls a ${d.kind} rest. Take it in Grimsheet.`, 'INFO').catch(() => { });
        return;
      }
      if (d && d.type === 'saveRes' && me.role === 'GM') { const key = 'grimsheet.attacks.' + room; S.write(key, S.mergeSaveRes(S.read(key) || [], d)); return; }
      if (d && d.type === 'saveReq' && d.to === me.id) {
        const key = 'grimsheet.saves.' + room, q = S.read(key) || [];
        if (!q.some(x => x.id === d.id)) { q.unshift({ id: d.id, aid: d.aid, from: d.from, ability: d.ability, dc: d.dc, what: d.what, skill: d.skill || '' }); S.write(key, q.slice(0, 10)); }
        OBR.notification.show(d.skill ? `${d.from} asks for a ${d.skill} check${d.dc ? ' (DC ' + d.dc + ')' : ''}. Roll it in Grimsheet.` : `${d.from} asks for a ${d.ability} save (DC ${d.dc}) against ${d.what}. Roll it in Grimsheet.`, 'WARNING').catch(() => { });
        return;
      }
      if (d && d.type === 'askInit' && me.role !== 'GM') OBR.notification.show(`${d.from} asks for initiative. Open Grimsheet and tap INIT in your Combat module.`, 'INFO').catch(() => { });
    });
    let lastTurn = null;
    const onInit = md => {
      if (paused) return;
      const I = md && md['com.grimsheet-test/initiative'];
      if (!I || !I.active || !I.rows) { lastTurn = null; return; }
      const key = I.round + '|' + I.turn; if (key === lastTurn) return; lastTurn = key;
      const i = I.rows.findIndex(r => r.k === I.turn), cur = I.rows[i], next = I.rows[(i + 1) % I.rows.length];
      if (me.role === 'GM') return;
      if (cur && cur.pc === me.id) {
        // reminders from the character this player has open
        const store = S.read(S.STORE), ch = store && store.chars && store.chars[store.active], rem = [];
        if (ch) {
          const down = ch.hp.cur <= 0 && ch.death && ch.death.s < 3 && ch.death.f < 3;
          if (down) {
            rem.push('You\'re down: roll a death saving throw');
            const key = 'grimsheet.saves.' + room, q = S.read(key) || [], id = 'death:' + I.round + '|' + I.turn;
            if (!q.some(x => x.id === id)) { q.unshift({ id, kind: 'death', char: ch.id }); S.write(key, q.slice(0, 10)); }
          }
          if (ch.conc && ch.conc.name) rem.push('concentrating on ' + ch.conc.name);
          (ch.modules || []).forEach(m => (m.entries || []).forEach(e => { if (e.effect && e.effect.active && !e.item && !(ch.conc && ch.conc.id === e.id)) rem.push(e.name + ' is on'); }));
          if ((ch.conditions || []).length) rem.push(ch.conditions.join(', '));
        }
        OBR.notification.show(`Your turn! Round ${I.round}.${rem.length ? ' ' + rem.join(' · ') + '.' : ''}`, rem.length && ch && ch.hp.cur <= 0 ? 'WARNING' : 'SUCCESS').catch(() => { });
      }
      else if (next && next.pc === me.id && I.rows.length > 2) OBR.notification.show(`You're up next, after ${cur ? cur.name : 'this turn'}.`, 'INFO').catch(() => { });
    };
    try { onInit(await OBR.room.getMetadata()); OBR.room.onMetadataChange(onInit); } catch (e) { }

    /* ---- token right-click menus (taken away while paused) ---- */
    const MENUS = [];
    MENUS.push({
      id: 'com.grimsheet-test/menu-link',
      icons: [{
        icon: ICON, label: 'Link to my Grimsheet character',
        filter: { min: 1, max: 1, roles: ['PLAYER'], permissions: ['UPDATE'], every: [{ key: 'layer', value: 'CHARACTER', coordinator: '&&' }, { key: ['metadata', S.LINK, 'player'], value: me.id, operator: '!=' }] },
      }],
      onClick: async ctx => {
        const store = S.read(S.STORE);
        const ch = store && store.chars && store.chars[store.active];
        if (!ch) { OBR.notification.show('Open Grimsheet and create or pick a character first, then link it.', 'WARNING'); return; }
        const st = (S.read(S.STATUS) || {})[ch.id];
        await OBR.scene.items.updateItems([ctx.items[0].id], drafts => {
          for (const it of drafts) {
            it.metadata[S.LINK] = { player: me.id, char: ch.id, name: ch.name, owner: me.name };
            if (st) it.metadata[S.BUBBLES] = Object.assign({}, it.metadata[S.BUBBLES] || {}, { health: st.hp, 'max health': st.max, 'temporary health': st.temp || 0, 'armor class': typeof st.ac === 'number' ? st.ac : 0, hide: false });
          }
        });
        OBR.notification.show(`${ch.name} is linked to this token. HP, AC and initiative now follow your sheet.`, 'SUCCESS');
      },
    });
    MENUS.push({
      id: 'com.grimsheet-test/menu-unlink',
      icons: [{ icon: ICON, label: 'Unlink from Grimsheet', filter: { min: 1, max: 1, roles: ['PLAYER'], every: [{ key: ['metadata', S.LINK, 'player'], value: me.id }] } }],
      onClick: async ctx => {
        await OBR.scene.items.updateItems(ctx.items.map(i => i.id), drafts => { for (const it of drafts) { delete it.metadata[S.LINK]; delete it.metadata[S.BUBBLES]; } });
        OBR.notification.show('Token unlinked from Grimsheet.');
      },
    });
    // the GM's menu opens a small panel inside the right-click menu
    MENUS.push({
      id: 'com.grimsheet-test/menu-gm',
      icons: [{ icon: ICON, label: 'Grimsheet', filter: { min: 1, roles: [me.role === 'GM' && realRole.v !== 'GM' ? 'PLAYER' : 'GM'], some: [{ key: 'layer', value: 'CHARACTER', coordinator: '||' }, { key: 'layer', value: 'MOUNT' }] } }],
      embed: { url: GM_URL, height: 260 },
    });
    const menus = on => Promise.all(MENUS.map(m => (on ? OBR.contextMenu.create(m) : OBR.contextMenu.remove(m.id)).catch(() => { })));
    if (!paused) await menus(true);
    onPause.push(p => menus(!p));
  })).catch(() => { });
})();
</script>
</body></html>
