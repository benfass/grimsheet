<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
:root{--gold:#c9a24a;--danger:#c0392b;--f-mono:ui-monospace,SFMono-Regular,Menlo,monospace}
#dicefx{position:absolute;inset:0;padding:8px 12px 10px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}
.tray3d{position:relative;width:min(540px,100%);height:200px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.tray3d>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tray3d .d3floor{position:absolute;top:20px;bottom:20px;left:20px;right:20px;overflow:hidden;border-radius:3px}
.tray3d canvas{display:block}
.dicefx .specwho{width:fit-content;max-width:100%;margin:0 0 6px 4px;padding:3px 12px;border-radius:999px;background:#3a220f;color:#fff8e6;border:1px solid #c9a24a;font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tray3d .d3x{pointer-events:auto;position:absolute;left:-8px;top:-8px;z-index:3;width:26px;height:26px;border-radius:50%;border:1px solid #c9a24a;background:#3a220f;color:#fff8e6;font-size:.8rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:0}
.tray3d .d3x:hover{background:#5d3920}
@media (pointer:coarse){.tray3d .d3x{width:32px;height:32px;left:-10px;top:-10px}}
.tray3d .d3wall{position:absolute;top:14px;bottom:14px;left:calc(50% - 5px);width:10px;border-radius:3px;background:linear-gradient(90deg,#3d2512,#7a4d2a 40%,#5d3920 70%,#2c1808);box-shadow:3px 0 8px rgba(0,0,0,.45),-3px 0 8px rgba(0,0,0,.3);opacity:0;transform:translateY(-14px);transition:opacity .25s,transform .3s;z-index:1;pointer-events:none}
.tray3d.split .d3wall{opacity:1;transform:none}
.tray3d .d3tot{position:absolute;right:26px;top:-14px;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:var(--f-mono);font-weight:700;font-size:1.2rem;color:#fff8e6;background:#3a220f;border:1px solid #c9a24a;border-radius:10px;padding:2px 10px;opacity:0;transform:scale(.7);transition:opacity .2s,transform .25s}
.tray3d .d3tot small{display:block;font-size:.62rem;font-weight:500;opacity:.85;text-align:center;margin-top:-3px}
.tray3d.landed .d3tot{opacity:1;transform:none}
.tray3d.crit{filter:drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 14px var(--gold))}
.tray3d.fum{animation:fumflash .7s ease-out}
@keyframes fumflash{0%,40%{filter:drop-shadow(0 0 4px var(--danger)) drop-shadow(0 0 18px var(--danger))}100%{filter:drop-shadow(0 0 2px var(--danger)) drop-shadow(0 10px 18px rgba(0,0,0,.28))}}
.tray3d{width:100%;height:150px;flex:none}
.dicefx .specwho{margin:0 0 16px 6px;max-width:calc(100% - 70px)}
.d3flat{margin:0 0 6px 6px;padding:6px 12px;border-radius:10px;background:#3a220f;color:#fff8e6;border:1px solid #c9a24a;font-weight:700;width:fit-content}
</style></head>
