<!doctype html>
<html><head><meta charset="utf-8"><title>Grimsheet background</title><script src="shared.js"></script></head>
<body>
<script>
/* Grimsheet background page for Owlbear Rodeo. Runs for each player while they are in the room,
   even when the Grimsheet panel is closed:
   - notifications and the table feed for rolls shared by other players;
   - token right-click menus: players link their own token; the GM gets a menu to link any player,
     apply damage or healing, open the sheet or unlink;
   - applies the GM's damage and healing to this player's saved character and answers the GM's
     requests to view the sheet;
   - for the GM: keeps players' attacks against tokens until the GM confirms them in Grimsheet. */
(function () {
  const S = GS;
  const ICON = new URL('icon.svg', location.href).href;
  const GM_URL = new URL('gm.html', location.href).href;

  S.sdk().then(OBR => OBR.onReady(async () => {
    const room = OBR.room && OBR.room.id ? OBR.room.id : 'room';
    const FEED = 'grimsheet.feed.' + room;
    const me = { id: OBR.player.id, name: await OBR.player.getName(), role: await OBR.player.getRole() };
    OBR.player.onChange(p => { me.name = p.name; me.role = p.role; });

    // heartbeat: while fresh, the panel leaves notifications and GM requests to this page
    const beat = () => S.write(S.BG, { at: Date.now(), room, v: S.VERSION });
    beat(); setInterval(beat, 15000);

    /* ---- rolls from other players ---- */
    OBR.broadcast.onMessage(S.CH_ROLL, ev => {
      const d = ev.data;
      if (!d || d.v !== 1) return;
      if (d.gmOnly && me.role !== 'GM') return;
      const feed = S.read(FEED) || [];
      feed.unshift(d); S.write(FEED, feed.slice(0, 100));
      const extra = d.crit ? ' · critical!' : d.fumble ? ' · natural 1' : '';
      OBR.notification.show(`${d.who} (${d.char}): ${d.title} = ${d.total}${extra}${d.gmOnly ? ' [GM only]' : ''}`, d.crit ? 'SUCCESS' : d.fumble ? 'WARNING' : 'DEFAULT').catch(() => { });
    });

    /* ---- GM requests aimed at this player ---- */
    const done = new Set();
    OBR.broadcast.onMessage(S.CH_GM, async ev => {
      const d = ev.data;
      if (!d || d.to !== me.id || done.has(d.id)) return;
      done.add(d.id);
      const store = S.read(S.STORE);
      const ch = store && store.chars && (store.chars[d.char] || store.chars[store.active]);
      if (d.type === 'hp') {
        if (!ch) return;
        const r = S.applyHp(ch, +d.amount || 0);
        S.write(S.STORE, store);
        // keep the party panel and the token in step with the new HP
        const all = S.read(S.STATUS) || {}; const st = Object.assign({}, all[ch.id] || {}, { charId: ch.id, char: ch.name, hp: r.hp, max: r.max, temp: r.temp, down: r.hp <= 0 });
        all[ch.id] = st; S.write(S.STATUS, all);
        if (store.active === ch.id) OBR.player.setMetadata({ [S.META]: st }).catch(() => { });
        try {
          const items = await OBR.scene.items.getItems(it => !!(it.metadata && it.metadata[S.LINK] && it.metadata[S.LINK].player === me.id && it.metadata[S.LINK].char === ch.id));
          if (items.length) await OBR.scene.items.updateItems(items.map(i => i.id), drafts => { for (const it of drafts) it.metadata[S.BUBBLES] = Object.assign({}, it.metadata[S.BUBBLES] || {}, { health: r.hp, 'max health': r.max, 'temporary health': r.temp }); });
        } catch (e) { }
        // concentrating: a CON save to keep the spell (DC 10 or half the damage); at 0 HP it ends (the panel tidies up)
        let conc = '';
        if (ch.conc && ch.conc.name && d.amount < 0) {
          if (r.hp <= 0) {
            conc = ` ${ch.conc.name} ends.`; const name = ch.conc.name, id = ch.conc.id; ch.conc = null;
            (ch.modules || []).forEach(m => (m.entries || []).forEach(e => { if (e.id === id && e.effect && !e.item) e.effect.active = false; }));
            S.write(S.STORE, store);
            OBR.scene.items.getItems(it => !!(it.metadata && it.metadata['com.grimsheet/area'] && it.metadata['com.grimsheet/area'].owner === me.id && it.metadata['com.grimsheet/area'].name === name))
              .then(its => its.length && OBR.scene.items.deleteItems(its.map(i => i.id))).catch(() => { });
          }
          else {
            const dc = Math.min(30, Math.max(10, Math.floor(-d.amount / 2))), key = 'grimsheet.saves.' + room, q = S.read(key) || [];
            q.unshift({ id: S.uid(), kind: 'conc', ability: 'CON', dc, what: ch.conc.name, dmg: -d.amount, char: ch.id }); S.write(key, q.slice(0, 10));
            conc = ` Concentration check: CON save DC ${dc} to keep ${ch.conc.name}.`;
          }
        }
        OBR.notification.show(`${d.from}: ${r.text} to ${ch.name}. HP ${r.hp}/${r.max}${r.temp ? ' (+' + r.temp + ' temp)' : ''}.${conc}`, d.amount < 0 ? 'WARNING' : 'SUCCESS').catch(() => { });
      }
      if (d.type === 'sheetReq') {
        if (!ch) { OBR.broadcast.sendMessage(S.CH_GM, { type: 'sheet', id: d.id, to: d.from, error: 'no character' }, { destination: 'REMOTE' }).catch(() => { }); return; }
        const parts = S.chunks(await S.pack(ch));
        for (let i = 0; i < parts.length; i++) await OBR.broadcast.sendMessage(S.CH_GM, { type: 'sheet', id: d.id, to: d.from, part: i, parts: parts.length, data: parts[i], owner: me.name }, { destination: 'REMOTE' }).catch(() => { });
      }
    });

    /* ---- campaign notes: keep the party journal up to date and answer newcomers ---- */
    const campGet = () => { const a = S.read(S.CAMP) || {}, c = a[room] || { name: '', notes: [], gone: {} }; c.notes = c.notes || []; c.gone = c.gone || {}; return c; };
    const campPut = c => { const a = S.read(S.CAMP) || {}; a[room] = c; S.write(S.CAMP, a); };
    const replies = {};
    OBR.broadcast.onMessage(S.CH_NOTES, ev => {
      const d = ev.data; if (!d) return;
      if (d.type === 'up' || d.type === 'del') {
        Object.values(replies).forEach(r => r.skip.add(d.type === 'up' ? d.note.id : d.id));
        const c = campGet();
        if (d.type === 'up' ? S.mergeNote(c, d.note) : (S.dropNote(c, d.id, d.at), true)) campPut(c);
        return;
      }
      if (d.type === 'name') { const c = campGet(); if ((c.nameAt || 0) < d.at) { c.name = d.name; c.nameAt = d.at; campPut(c); } return; }
      if (d.type === 'hello' && d.from !== me.id) {
        const c = campGet(), have = new Map(d.have || []);
        for (const [id, at] of d.gone || []) if (!c.gone[id] || c.gone[id] < at) S.dropNote(c, id, at);
        campPut(c);
        const mine = c.notes.filter(n => n.vis === 'party' && (!have.has(n.id) || have.get(n.id) < n.updated));
        const gone = Object.entries(c.gone).filter(([id]) => have.has(id));
        if (!mine.length && !gone.length) return;
        const key = d.from + Math.random(), r = replies[key] = { skip: new Set() };
        setTimeout(() => {
          delete replies[key];
          const send = x => OBR.broadcast.sendMessage(S.CH_NOTES, x, { destination: 'REMOTE' }).catch(() => { });
          mine.filter(n => !r.skip.has(n.id)).forEach(n => send({ type: 'up', note: n }));
          gone.filter(([id]) => !r.skip.has(id)).forEach(([id, at]) => send({ type: 'del', id, at }));
          if (c.name) send({ type: 'name', name: c.name, at: c.nameAt || 0 });
        }, 150 + Math.random() * 900);
      }
    });

    /* ---- initiative: the GM asks for rolls; tell this player when it's their turn ---- */
    OBR.broadcast.onMessage(S.CH_GM, ev => {
      const d = ev.data;
      if (d && d.type === 'atk' && d.v === 1 && me.role === 'GM') {
        const key = 'grimsheet.attacks.' + room;
        S.write(key, S.mergeAttack(S.read(key) || [], d));
        if (d.part === 'area') { OBR.notification.show(`${d.attacker}: ${d.name} (${d.areaLabel}), ${(d.targets || []).length} inside. Resolve it in Grimsheet.`, 'DEFAULT').catch(() => { }); return; }
        const what = d.part === 'atk' ? d.total + ' to hit' + (d.crit ? ' (natural 20!)' : d.fumble ? ' (natural 1)' : '') : d.part === 'heal' ? d.total + ' healing' : d.total + ' ' + (d.types || '') + ' damage';
        OBR.notification.show(`${d.attacker} → ${d.target.name}: ${what}. Confirm it in Grimsheet.`, d.crit ? 'SUCCESS' : 'DEFAULT').catch(() => { });
        return;
      }
      if (d && d.type === 'saveRes' && me.role === 'GM') { const key = 'grimsheet.attacks.' + room; S.write(key, S.mergeSaveRes(S.read(key) || [], d)); return; }
      if (d && d.type === 'saveReq' && d.to === me.id) {
        const key = 'grimsheet.saves.' + room, q = S.read(key) || [];
        if (!q.some(x => x.id === d.id)) { q.unshift({ id: d.id, aid: d.aid, from: d.from, ability: d.ability, dc: d.dc, what: d.what }); S.write(key, q.slice(0, 10)); }
        OBR.notification.show(`${d.from} asks for a ${d.ability} save (DC ${d.dc}) against ${d.what}. Roll it in Grimsheet.`, 'WARNING').catch(() => { });
        return;
      }
      if (d && d.type === 'askInit' && me.role !== 'GM') OBR.notification.show(`${d.from} asks for initiative. Open Grimsheet and tap INIT in your Combat module.`, 'INFO').catch(() => { });
    });
    let lastTurn = null;
    const onInit = md => {
      const I = md && md['com.grimsheet/initiative'];
      if (!I || !I.active || !I.rows) { lastTurn = null; return; }
      const key = I.round + '|' + I.turn; if (key === lastTurn) return; lastTurn = key;
      const i = I.rows.findIndex(r => r.k === I.turn), cur = I.rows[i], next = I.rows[(i + 1) % I.rows.length];
      if (me.role === 'GM') return;
      if (cur && cur.pc === me.id) {
        // reminders from the character this player has open
        const store = S.read(S.STORE), ch = store && store.chars && store.chars[store.active], rem = [];
        if (ch) {
          const down = ch.hp.cur <= 0 && ch.death && ch.death.s < 3 && ch.death.f < 3;
          if (down) {
            rem.push('You\'re down: roll a death saving throw');
            const key = 'grimsheet.saves.' + room, q = S.read(key) || [], id = 'death:' + I.round + '|' + I.turn;
            if (!q.some(x => x.id === id)) { q.unshift({ id, kind: 'death', char: ch.id }); S.write(key, q.slice(0, 10)); }
          }
          if (ch.conc && ch.conc.name) rem.push('concentrating on ' + ch.conc.name);
          (ch.modules || []).forEach(m => (m.entries || []).forEach(e => { if (e.effect && e.effect.active && !e.item && !(ch.conc && ch.conc.id === e.id)) rem.push(e.name + ' is on'); }));
          if ((ch.conditions || []).length) rem.push(ch.conditions.join(', '));
        }
        OBR.notification.show(`Your turn! Round ${I.round}.${rem.length ? ' ' + rem.join(' · ') + '.' : ''}`, rem.length && ch && ch.hp.cur <= 0 ? 'WARNING' : 'SUCCESS').catch(() => { });
      }
      else if (next && next.pc === me.id && I.rows.length > 2) OBR.notification.show(`You're up next, after ${cur ? cur.name : 'this turn'}.`, 'INFO').catch(() => { });
    };
    try { onInit(await OBR.room.getMetadata()); OBR.room.onMetadataChange(onInit); } catch (e) { }

    /* ---- token right-click menus ---- */
    await OBR.contextMenu.create({
      id: 'com.grimsheet/menu-link',
      icons: [{
        icon: ICON, label: 'Link to my Grimsheet character',
        filter: { min: 1, max: 1, roles: ['PLAYER'], permissions: ['UPDATE'], every: [{ key: 'layer', value: 'CHARACTER', coordinator: '&&' }, { key: ['metadata', S.LINK, 'player'], value: me.id, operator: '!=' }] },
      }],
      onClick: async ctx => {
        const store = S.read(S.STORE);
        const ch = store && store.chars && store.chars[store.active];
        if (!ch) { OBR.notification.show('Open Grimsheet and create or pick a character first, then link it.', 'WARNING'); return; }
        const st = (S.read(S.STATUS) || {})[ch.id];
        await OBR.scene.items.updateItems([ctx.items[0].id], drafts => {
          for (const it of drafts) {
            it.metadata[S.LINK] = { player: me.id, char: ch.id, name: ch.name, owner: me.name };
            if (st) it.metadata[S.BUBBLES] = Object.assign({}, it.metadata[S.BUBBLES] || {}, { health: st.hp, 'max health': st.max, 'temporary health': st.temp || 0, 'armor class': typeof st.ac === 'number' ? st.ac : 0 });
          }
        });
        OBR.notification.show(`${ch.name} is linked to this token. HP, AC and initiative now follow your sheet.`, 'SUCCESS');
      },
    });
    await OBR.contextMenu.create({
      id: 'com.grimsheet/menu-unlink',
      icons: [{ icon: ICON, label: 'Unlink from Grimsheet', filter: { min: 1, max: 1, roles: ['PLAYER'], every: [{ key: ['metadata', S.LINK, 'player'], value: me.id }] } }],
      onClick: async ctx => {
        await OBR.scene.items.updateItems(ctx.items.map(i => i.id), drafts => { for (const it of drafts) delete it.metadata[S.LINK]; });
        OBR.notification.show('Token unlinked from Grimsheet.');
      },
    });
    // the GM's menu opens a small panel inside the right-click menu
    await OBR.contextMenu.create({
      id: 'com.grimsheet/menu-gm',
      icons: [{ icon: ICON, label: 'Grimsheet', filter: { min: 1, roles: ['GM'], some: [{ key: 'layer', value: 'CHARACTER', coordinator: '||' }, { key: 'layer', value: 'MOUNT' }] } }],
      embed: { url: GM_URL, height: 260 },
    });
  })).catch(() => { });
})();
</script>
</body></html>
